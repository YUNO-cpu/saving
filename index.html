<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cute Pixel Claw Machine 🎀</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');
        
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #ffe0f0 50%, #ffd6eb 100%);
        }
        #canvas {
            display: block;
            width: 100%;
            height: 100vh;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #ui {
            position: absolute;
            top: 30px;
            left: 30px;
            color: #ff6b9d;
            background: white;
            padding: 25px 30px;
            border-radius: 20px;
            font-size: 20px;
            box-shadow: 0 8px 30px rgba(255, 107, 157, 0.3);
            border: 3px solid #ffb3d9;
        }
        #ui div {
            margin: 8px 0;
            font-weight: 600;
        }
        .emoji {
            font-size: 24px;
            margin-right: 8px;
        }
        #controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            flex-direction: column;
            align-items: center;
        }
        .control-row {
            display: flex;
            gap: 15px;
        }
        button {
            padding: 18px 35px;
            font-size: 20px;
            background: white;
            color: #ff6b9d;
            border: 3px solid #ffb3d9;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.2);
        }
        button:hover {
            background: #fff5f9;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.3);
        }
        button:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(255, 107, 157, 0.2);
        }
        #grabBtn {
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fb3 100%);
            color: white;
            padding: 25px 50px;
            font-size: 26px;
            border: 3px solid #ff9ec4;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        #grabBtn:hover {
            background: linear-gradient(135deg, #ff8fb3 0%, #ffb3d9 100%);
        }
        #instructions {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: #ff6b9d;
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 15px 50px rgba(255, 107, 157, 0.3);
            border: 4px solid #ffb3d9;
        }
        #instructions h2 {
            margin-top: 0;
            font-size: 36px;
            color: #ff6b9d;
            font-weight: 700;
        }
        #instructions p {
            font-size: 18px;
            line-height: 1.6;
            color: #ff8fb3;
        }
        #instructions button {
            margin-top: 20px;
            background: linear-gradient(135deg, #ff6b9d 0%, #ff8fb3 100%);
            color: white;
            font-size: 22px;
            padding: 20px 40px;
        }
        .prize-collected {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: #ff6b9d;
            padding: 40px 50px;
            border-radius: 25px;
            font-size: 32px;
            font-weight: 700;
            animation: popIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 15px 50px rgba(255, 107, 157, 0.4);
            border: 4px solid #ffb3d9;
        }
        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-180deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }
        .sparkle {
            position: absolute;
            pointer-events: none;
            font-size: 30px;
            animation: sparkleFloat 1.5s ease-out forwards;
        }
        @keyframes sparkleFloat {
            0% { transform: translate(0, 0) scale(0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    
    <div id="instructions">
        <h2>🎀 Pixel Claw Machine 🎀</h2>
        <p>Catch adorable pixel animals!</p>
        <p><strong>🕹️ Use arrows to move</strong></p>
        <p><strong>Press GRAB to catch cuties!</strong></p>
        <p>Collect bears, bunnies, cats, and more!</p>
        <button onclick="startGame()">Start Game</button>
    </div>
    
    <div id="ui" style="display: none;">
        <div><span class="emoji">💰</span>Credits: <span id="credits">10</span></div>
        <div><span class="emoji">🎁</span>Cuties Won: <span id="prizes">0</span></div>
    </div>
    
    <div id="controls" style="display: none;">
        <div class="control-row">
            <button onclick="moveClaw('forward')">⬆️</button>
        </div>
        <div class="control-row">
            <button onclick="moveClaw('left')">⬅️</button>
            <button onclick="moveClaw('backward')">⬇️</button>
            <button onclick="moveClaw('right')">➡️</button>
        </div>
        <div class="control-row">
            <button id="grabBtn" onclick="grab()">GRAB!</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let claw, clawArm, clawFingers = [];
        let prizes = [];
        let clawPosition = { x: 0, z: 0 };
        let isGrabbing = false;
        let credits = 10;
        let prizesWon = 0;
        let heldPrize = null;

        const MOVE_SPEED = 0.15;
        const CLAW_MIN_X = -2.5;
        const CLAW_MAX_X = 2.5;
        const CLAW_MIN_Z = -2.5;
        const CLAW_MAX_Z = 2.5;

        // Pixel/voxel helpers
        function createVoxel(size, color) {
            const geometry = new THREE.BoxGeometry(size, size, size);
            const material = new THREE.MeshStandardMaterial({ 
                color: color,
                flatShading: true
            });
            return new THREE.Mesh(geometry, material);
        }

        function createAnimal(type) {
            const group = new THREE.Group();
            
            if (type === 'bear') {
                // Body
                const body = createVoxel(0.4, 0xffb86c);
                group.add(body);
                
                // Head
                const head = createVoxel(0.35, 0xffb86c);
                head.position.y = 0.35;
                group.add(head);
                
                // Ears
                const ear1 = createVoxel(0.15, 0xd98c4d);
                ear1.position.set(-0.15, 0.5, 0);
                group.add(ear1);
                const ear2 = createVoxel(0.15, 0xd98c4d);
                ear2.position.set(0.15, 0.5, 0);
                group.add(ear2);
                
                // Eyes
                const eye1 = createVoxel(0.08, 0x000000);
                eye1.position.set(-0.1, 0.4, 0.18);
                group.add(eye1);
                const eye2 = createVoxel(0.08, 0x000000);
                eye2.position.set(0.1, 0.4, 0.18);
                group.add(eye2);
                
                // Nose
                const nose = createVoxel(0.1, 0x000000);
                nose.position.set(0, 0.3, 0.2);
                group.add(nose);
            }
            else if (type === 'bunny') {
                // Body
                const body = createVoxel(0.35, 0xffd6f5);
                group.add(body);
                
                // Head
                const head = createVoxel(0.3, 0xffd6f5);
                head.position.y = 0.3;
                group.add(head);
                
                // Long ears
                const ear1 = createVoxel(0.08, 0xffb3e6);
                ear1.scale.y = 2.5;
                ear1.position.set(-0.12, 0.55, 0);
                group.add(ear1);
                const ear2 = createVoxel(0.08, 0xffb3e6);
                ear2.scale.y = 2.5;
                ear2.position.set(0.12, 0.55, 0);
                group.add(ear2);
                
                // Eyes
                const eye1 = createVoxel(0.08, 0xff1493);
                eye1.position.set(-0.08, 0.35, 0.16);
                group.add(eye1);
                const eye2 = createVoxel(0.08, 0xff1493);
                eye2.position.set(0.08, 0.35, 0.16);
                group.add(eye2);
            }
            else if (type === 'cat') {
                // Body
                const body = createVoxel(0.4, 0xffeb99);
                group.add(body);
                
                // Head
                const head = createVoxel(0.32, 0xffeb99);
                head.position.y = 0.34;
                group.add(head);
                
                // Pointy ears
                const ear1 = createVoxel(0.12, 0xffd966);
                ear1.position.set(-0.14, 0.52, 0);
                ear1.rotation.z = -0.3;
                group.add(ear1);
                const ear2 = createVoxel(0.12, 0xffd966);
                ear2.position.set(0.14, 0.52, 0);
                ear2.rotation.z = 0.3;
                group.add(ear2);
                
                // Eyes
                const eye1 = createVoxel(0.1, 0x00ff00);
                eye1.position.set(-0.08, 0.38, 0.17);
                group.add(eye1);
                const eye2 = createVoxel(0.1, 0x00ff00);
                eye2.position.set(0.08, 0.38, 0.17);
                group.add(eye2);
            }
            else if (type === 'dog') {
                // Body
                const body = createVoxel(0.4, 0xcc9966);
                group.add(body);
                
                // Head
                const head = createVoxel(0.35, 0xcc9966);
                head.position.y = 0.35;
                group.add(head);
                
                // Floppy ears
                const ear1 = createVoxel(0.15, 0x996633);
                ear1.position.set(-0.2, 0.35, 0);
                ear1.scale.y = 1.5;
                group.add(ear1);
                const ear2 = createVoxel(0.15, 0x996633);
                ear2.position.set(0.2, 0.35, 0);
                ear2.scale.y = 1.5;
                group.add(ear2);
                
                // Eyes
                const eye1 = createVoxel(0.08, 0x000000);
                eye1.position.set(-0.1, 0.4, 0.18);
                group.add(eye1);
                const eye2 = createVoxel(0.08, 0x000000);
                eye2.position.set(0.1, 0.4, 0.18);
                group.add(eye2);
            }
            else if (type === 'panda') {
                // Body
                const body = createVoxel(0.4, 0xffffff);
                group.add(body);
                
                // Head
                const head = createVoxel(0.35, 0xffffff);
                head.position.y = 0.35;
                group.add(head);
                
                // Ears
                const ear1 = createVoxel(0.15, 0x000000);
                ear1.position.set(-0.15, 0.5, 0);
                group.add(ear1);
                const ear2 = createVoxel(0.15, 0x000000);
                ear2.position.set(0.15, 0.5, 0);
                group.add(ear2);
                
                // Eye patches
                const patch1 = createVoxel(0.15, 0x000000);
                patch1.position.set(-0.1, 0.4, 0.15);
                group.add(patch1);
                const patch2 = createVoxel(0.15, 0x000000);
                patch2.position.set(0.1, 0.4, 0.15);
                group.add(patch2);
            }
            else if (type === 'pig') {
                // Body
                const body = createVoxel(0.4, 0xffb3d9);
                group.add(body);
                
                // Head
                const head = createVoxel(0.35, 0xffb3d9);
                head.position.y = 0.35;
                group.add(head);
                
                // Ears
                const ear1 = createVoxel(0.12, 0xff99cc);
                ear1.position.set(-0.14, 0.48, 0);
                ear1.rotation.z = -0.4;
                group.add(ear1);
                const ear2 = createVoxel(0.12, 0xff99cc);
                ear2.position.set(0.14, 0.48, 0);
                ear2.rotation.z = 0.4;
                group.add(ear2);
                
                // Snout
                const snout = createVoxel(0.15, 0xff99cc);
                snout.position.set(0, 0.3, 0.2);
                group.add(snout);
            }
            
            group.castShadow = true;
            group.receiveShadow = true;
            return group;
        }

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffeef8);
            
            // Camera
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 7, 9);
            camera.lookAt(0, 0, 0);

            // Renderer
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('canvas'), 
                antialias: false 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(5, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);

            // Cute machine base
            const baseGeometry = new THREE.BoxGeometry(6, 0.3, 6);
            const baseMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xffb3d9,
                flatShading: true
            });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.position.y = -0.15;
            base.receiveShadow = true;
            scene.add(base);

            // Pink decorative border
            const borderMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xff99cc,
                flatShading: true
            });
            const border1 = new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.1, 0.2), borderMaterial);
            border1.position.set(0, 0.05, -3);
            scene.add(border1);
            const border2 = new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.1, 0.2), borderMaterial);
            border2.position.set(0, 0.05, 3);
            scene.add(border2);
            const border3 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 6.2), borderMaterial);
            border3.position.set(-3, 0.05, 0);
            scene.add(border3);
            const border4 = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.1, 6.2), borderMaterial);
            border4.position.set(3, 0.05, 0);
            scene.add(border4);

            // Cute pastel walls
            const wallMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.3,
                flatShading: true
            });

            const wallGeometry = new THREE.BoxGeometry(6, 5, 0.1);
            const frontWall = new THREE.Mesh(wallGeometry, wallMaterial);
            frontWall.position.set(0, 2.5, -3);
            scene.add(frontWall);

            const backWall = new THREE.Mesh(wallGeometry, wallMaterial);
            backWall.position.set(0, 2.5, 3);
            scene.add(backWall);

            const sideWallGeometry = new THREE.BoxGeometry(0.1, 5, 6);
            const leftWall = new THREE.Mesh(sideWallGeometry, wallMaterial);
            leftWall.position.set(-3, 2.5, 0);
            scene.add(leftWall);

            const rightWall = new THREE.Mesh(sideWallGeometry, wallMaterial);
            rightWall.position.set(3, 2.5, 0);
            scene.add(rightWall);

            // Top frame
            const topMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xffccee,
                flatShading: true
            });
            const top = new THREE.Mesh(new THREE.BoxGeometry(6.2, 0.3, 6.2), topMaterial);
            top.position.y = 5;
            scene.add(top);

            // Create cute claw
            createClaw();

            // Create animal prizes
            createPrizes();

            // Handle window resize
            window.addEventListener('resize', onWindowResize);
        }

        function createClaw() {
            // Claw cable - pixel style
            const cableGeometry = new THREE.BoxGeometry(0.1, 3, 0.1);
            const cableMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xff6b9d,
                flatShading: true
            });
            clawArm = new THREE.Mesh(cableGeometry, cableMaterial);
            clawArm.position.y = 5.5;
            scene.add(clawArm);

            // Claw base - cute pink
            const baseGeometry = new THREE.BoxGeometry(0.4, 0.3, 0.4);
            const baseMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xff99cc,
                flatShading: true
            });
            claw = new THREE.Mesh(baseGeometry, baseMaterial);
            claw.position.y = 4;
            claw.castShadow = true;
            scene.add(claw);

            // Claw fingers - blocky pixel style
            const fingerGeometry = new THREE.BoxGeometry(0.12, 0.6, 0.12);
            const fingerMaterial = new THREE.MeshStandardMaterial({ 
                color: 0xffb3d9,
                flatShading: true
            });
            
            for (let i = 0; i < 4; i++) {
                const finger = new THREE.Mesh(fingerGeometry, fingerMaterial);
                const angle = (i / 4) * Math.PI * 2;
                finger.position.x = Math.cos(angle) * 0.3;
                finger.position.z = Math.sin(angle) * 0.3;
                finger.position.y = -0.3;
                finger.rotation.z = Math.cos(angle) * 0.3;
                finger.rotation.x = Math.sin(angle) * 0.3;
                finger.castShadow = true;
                claw.add(finger);
                clawFingers.push({ mesh: finger, angle: angle });
            }

            // Heart decoration on claw
            const heartGeo = new THREE.BoxGeometry(0.15, 0.15, 0.05);
            const heartMat = new THREE.MeshStandardMaterial({ 
                color: 0xff1493,
                flatShading: true
            });
            const heart = new THREE.Mesh(heartGeo, heartMat);
            heart.position.y = 0.2;
            claw.add(heart);
        }

        function createPrizes() {
            const animalTypes = ['bear', 'bunny', 'cat', 'dog', 'panda', 'pig'];

            for (let i = 0; i < 12; i++) {
                const type = animalTypes[Math.floor(Math.random() * animalTypes.length)];
                const animal = createAnimal(type);
                
                animal.position.x = (Math.random() - 0.5) * 4.5;
                animal.position.y = 0.3;
                animal.position.z = (Math.random() - 0.5) * 4.5;
                
                animal.rotation.y = Math.random() * Math.PI * 2;
                
                animal.userData.type = type;
                
                scene.add(animal);
                prizes.push(animal);
            }
        }

        function moveClaw(direction) {
            if (isGrabbing) return;

            switch(direction) {
                case 'forward':
                    clawPosition.z = Math.max(CLAW_MIN_Z, clawPosition.z - MOVE_SPEED);
                    break;
                case 'backward':
                    clawPosition.z = Math.min(CLAW_MAX_Z, clawPosition.z + MOVE_SPEED);
                    break;
                case 'left':
                    clawPosition.x = Math.max(CLAW_MIN_X, clawPosition.x - MOVE_SPEED);
                    break;
                case 'right':
                    clawPosition.x = Math.min(CLAW_MAX_X, clawPosition.x + MOVE_SPEED);
                    break;
            }

            claw.position.x = clawPosition.x;
            claw.position.z = clawPosition.z;
            clawArm.position.x = clawPosition.x;
            clawArm.position.z = clawPosition.z;
        }

        async function grab() {
            if (isGrabbing || credits <= 0) return;

            isGrabbing = true;
            credits--;
            document.getElementById('credits').textContent = credits;

            // Lower claw
            await animateClaw(claw.position.y, 0.5, 1000);

            // Close fingers
            closeFingers();

            // Check for prize
            checkPrizeGrab();

            await new Promise(resolve => setTimeout(resolve, 500));

            // Raise claw
            await animateClaw(claw.position.y, 4, 1000);

            // Open fingers
            openFingers();

            // Check if prize made it
            if (heldPrize && heldPrize.position.y > 3) {
                collectPrize();
            } else if (heldPrize) {
                heldPrize = null;
            }

            isGrabbing = false;

            if (credits === 0) {
                setTimeout(() => {
                    alert(`🎀 Game Over! You won ${prizesWon} adorable cuties! 💖`);
                    location.reload();
                }, 500);
            }
        }

        function animateClaw(startY, endY, duration) {
            return new Promise(resolve => {
                const startTime = Date.now();
                
                function animate() {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    claw.position.y = startY + (endY - startY) * progress;
                    clawArm.scale.y = (5.5 - claw.position.y) / 3;
                    clawArm.position.y = claw.position.y + (5.5 - claw.position.y) / 2;
                    
                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        resolve();
                    }
                }
                
                animate();
            });
        }

        function closeFingers() {
            clawFingers.forEach((finger) => {
                finger.mesh.rotation.z = Math.cos(finger.angle) * 0.8;
                finger.mesh.rotation.x = Math.sin(finger.angle) * 0.8;
            });
        }

        function openFingers() {
            clawFingers.forEach((finger) => {
                finger.mesh.rotation.z = Math.cos(finger.angle) * 0.3;
                finger.mesh.rotation.x = Math.sin(finger.angle) * 0.3;
            });
        }

        function checkPrizeGrab() {
            const clawBox = new THREE.Box3().setFromObject(claw);
            
            for (let prize of prizes) {
                const prizeBox = new THREE.Box3().setFromObject(prize);
                
                if (clawBox.intersectsBox(prizeBox)) {
                    if (Math.random() < 0.65) {
                        heldPrize = prize;
                        return;
                    }
                }
            }
        }

        function collectPrize() {
            if (!heldPrize) return;

            prizesWon++;
            document.getElementById('prizes').textContent = prizesWon;

            const animalEmojis = {
                'bear': '🧸',
                'bunny': '🐰',
                'cat': '🐱',
                'dog': '🐶',
                'panda': '🐼',
                'pig': '🐷'
            };

            scene.remove(heldPrize);
            prizes = prizes.filter(p => p !== heldPrize);

            // Show cute message
            const emoji = animalEmojis[heldPrize.userData.type] || '🎁';
            const message = document.createElement('div');
            message.className = 'prize-collected';
            message.innerHTML = `${emoji} You got a ${heldPrize.userData.type}! ${emoji}`;
            document.body.appendChild(message);
            
            // Create sparkles
            createSparkles();
            
            setTimeout(() => message.remove(), 2000);

            heldPrize = null;
        }

        function createSparkles() {
            const sparkleEmojis = ['✨', '💖', '⭐', '💫', '🌟'];
            for (let i = 0; i < 8; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.textContent = sparkleEmojis[Math.floor(Math.random() * sparkleEmojis.length)];
                sparkle.style.left = '50%';
                sparkle.style.top = '50%';
                sparkle.style.setProperty('--tx', `${(Math.random() - 0.5) * 200}px`);
                sparkle.style.setProperty('--ty', `${(Math.random() - 0.5) * 200}px`);
                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 1500);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            // Animate held prize
            if (heldPrize && isGrabbing) {
                heldPrize.position.x = claw.position.x;
                heldPrize.position.y = claw.position.y - 0.5;
                heldPrize.position.z = claw.position.z;
            }

            // Gentle bobbing animation for prizes
            const time = Date.now() * 0.001;
            prizes.forEach((prize, i) => {
                prize.rotation.y = Math.sin(time + i) * 0.1;
                if (!isGrabbing || prize !== heldPrize) {
                    prize.position.y = 0.3 + Math.sin(time * 2 + i) * 0.02;
                }
            });

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function startGame() {
            document.getElementById('instructions').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            document.getElementById('controls').style.display = 'flex';
            init();
            animate();
        }
    </script>
</body>
</html>
